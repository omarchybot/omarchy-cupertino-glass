# Omarchy shell surfaces styled for macOS Clear (frosted glass / vibrancy)

[bar]
background       = "#16181d"
background-alpha = 0.35
text             = "#f5f5f7"
active           = "#ff453a"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "rgba(0a84ffee) rgba(64d2ffee) 45deg"
active-border-foreground = "rgba(ffffff33)"

[controls]
normal-color        = "#f5f5f7"
normal-fill-alpha   = 0.08
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ffffff"
hover-cursor-fill-alpha   = 0.18
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#ffffff"
focus-fill-alpha   = 0.18
focus-border       = "#0a84ff"
focus-border-width = 1
focus-border-alpha = 0.60

selected-color        = "#ffffff"
selected-fill-alpha   = 0.28
selected-border       = "#0a84ff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.30
selection-fill-alpha = 0.40

[popups]
background       = "#16181d"
background-alpha = 0.65
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.15
border-width     = 1

[tooltip]
background       = "#1c1c1e"
background-alpha = 0.75
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.15

[notifications]
background       = "#16181d"
background-alpha = 0.70
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.18
border-width     = 1
countdown        = "#0a84ff"

[launcher]
background                = "#16181d"
background-alpha          = 0.70
text                      = "#f5f5f7"
border                    = "#ffffff"
border-alpha              = 0.20
scrim                     = "#000000"
scrim-alpha               = 0.35
selected-background       = "#0a84ff"
selected-background-alpha = 0.85
selected-text             = "#ffffff"
selected-border           = "#0a84ff"
selected-border-alpha     = 0.0

[menu]
background                = "#16181d"
background-alpha          = 0.70
text                      = "#f5f5f7"
border                    = "#ffffff"
border-alpha              = 0.20
scrim                     = "#000000"
scrim-alpha               = 0.35
selected-background       = "#0a84ff"
selected-background-alpha = 0.85
selected-text             = "#ffffff"
selected-border           = "#0a84ff"
selected-border-alpha     = 0.0

[polkit]
background       = "#16181d"
background-alpha = 0.75
text             = "#f5f5f7"
text-error       = "#ff453a"
border           = "#ffffff"
border-error     = "#ff453a"
border-alpha     = 0.20
scrim            = "#000000"
scrim-alpha      = 0.45
accent           = "#0a84ff"

[lock]
background       = "#16181d"
background-alpha = 0.60
text             = "#f5f5f7"
placeholder      = "#86868b"
text-error       = "#ff453a"
border           = "#ffffff"
border-active    = "#0a84ff"
border-error     = "#ff453a"
border-alpha     = 0.20
selection        = "#0a84ff"
selection-alpha  = 0.50

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.40
text                    = "#f5f5f7"
selected-border         = "#0a84ff"
selected-border-alpha   = 1.0
unselected-border       = "#ffffff"
unselected-border-alpha = 0.20
